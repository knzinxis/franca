<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030817">
  <title>Painel administrativo | Guilda França</title>
  <link rel="stylesheet" href="style.css?v=20261119g">
  <link rel="stylesheet" href="admin.css?v=20261119a">
</head>
<body class="admin-body">
  <main class="admin-page">
    <section class="login-box" id="login-box" aria-labelledby="login-title">
      <p class="admin-kicker">ÁREA RESTRITA</p>
      <h1 id="login-title">Painel da França</h1>
      <p class="login-description">Entre com a conta administrativa autorizada.</p>
      <form id="login-form" autocomplete="on">
        <label for="admin-email">E-mail</label>
        <input id="admin-email" name="email" type="email" autocomplete="username" required>
        <label for="admin-password">Senha</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">ENTRAR</button>
      </form>
      <p class="notice" id="login-message" role="status" aria-live="polite"></p>
    </section>

    <section id="panel" class="hidden" aria-labelledby="panel-title">
      <header class="admin-head">
        <div>
          <p class="admin-kicker">FRANÇA GUILDA</p>
          <h1 id="panel-title">Painel de recrutamento</h1>
        </div>
        <div class="admin-actions">
          <button class="admin-secondary" id="refresh-button" type="button">ATUALIZAR</button>
          <button class="admin-export" id="export-button" type="button">EXPORTAR CSV</button>
          <button class="admin-logout" id="logout-button" type="button">SAIR</button>
        </div>
      </header>

      <p class="notice" id="panel-message" role="status" aria-live="polite"></p>

      <section class="stats-grid" aria-label="Resumo das inscrições">
        <article class="stat-card"><span>TOTAL</span><strong id="total-count">0</strong></article>
        <article class="stat-card"><span>PENDENTES</span><strong id="pending-count">0</strong></article>
        <article class="stat-card"><span>APROVADOS</span><strong id="approved-count">0</strong></article>
        <article class="stat-card"><span>REJEITADOS</span><strong id="rejected-count">0</strong></article>
      </section>

      <section class="filter-panel" aria-label="Busca e filtros">
        <label class="search-control" for="candidate-search">
          <span>Buscar candidato</span>
          <input id="candidate-search" type="search" placeholder="Nome, nick, ID ou WhatsApp">
        </label>
        <label class="status-control" for="status-filter">
          <span>Status</span>
          <select id="status-filter">
            <option value="todos">Todos os status</option>
            <option value="Pendente">Pendentes</option>
            <option value="Aprovado">Aprovados</option>
            <option value="Rejeitado">Rejeitados</option>
            <option value="Removido">Removidos</option>
          </select>
        </label>
      </section>

      <section aria-labelledby="applications-title">
        <div class="section-heading">
          <h2 id="applications-title">INSCRIÇÕES PARA ANALISAR</h2>
          <button class="admin-clear" id="clear-button" type="button">EXCLUIR TODAS</button>
        </div>
        <div class="candidate-list" id="candidate-list"></div>
      </section>

      <section class="approved-section" aria-labelledby="approved-title">
        <div class="section-heading">
          <h2 id="approved-title">MEMBROS APROVADOS</h2>
        </div>
        <div class="candidate-list" id="approved-list"></div>
      </section>
    </section>
  </main>
  <script src="admin.js?v=20261119m"></script>
</body>
</html>
